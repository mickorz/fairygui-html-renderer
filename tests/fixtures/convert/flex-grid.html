<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #2b2b2b; }
  /* Flex 布局样本：提取发生在渲染后，导出的是计算后的最终位置 */
  #canvas { position: relative; width: 400px; height: 220px; background: #333; display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; box-sizing: border-box; }
  .cell { width: 80px; height: 60px; background: #3d6b8f; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }
</style>
</head>
<body>
<div id="canvas">
  <div class="cell">C1</div>
  <div class="cell">C2</div>
  <div class="cell">C3</div>
  <div class="cell">C4</div>
  <div class="cell">C5</div>
  <div class="cell">C6</div>
  <div class="cell">C7</div>
  <div class="cell">C8</div>
</div>
</body>
</html>
