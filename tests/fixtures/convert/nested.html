<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #2b2b2b; }
  #canvas { position: relative; width: 400px; height: 300px; background: #333; }
  #panel { position: absolute; left: 30px; top: 30px; width: 220px; height: 150px; background: #223344; }
  #panelTitle { position: absolute; left: 10px; top: 8px; width: 200px; height: 22px; font-size: 16px; color: #ffd666; }
  #avatar { position: absolute; left: 10px; top: 40px; width: 61px; height: 53px; opacity: 0.6; transform: rotate(-12deg); }
</style>
</head>
<body>
<div id="canvas">
  <div id="panel">
    <div id="panelTitle">Nested Panel</div>
    <img id="avatar" src="images/pic.png">
  </div>
</div>
</body>
</html>
